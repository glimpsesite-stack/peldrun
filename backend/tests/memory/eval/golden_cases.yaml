# backend/tests/memory/eval/golden_cases.yaml
# Golden evaluation set for the memory repair plan (phase 0).
# 163 cases: Arabic-first, then English and Russian.
#
# IMPORTANT ENCODING POLICY (agreed with the repo owner):
#   * All keys, comments, ids and structural values are ASCII/English.
#   * Non-ASCII (Arabic/Cyrillic) appears ONLY inside quoted DATA strings
#     (memories / query / new / text). This file is test data, not code.
#
# Schema
# ------
# Retrieval kinds (run by harness.py today):
#   positive  : memories + query + expect_idx (indexes that MUST be retrieved)
#   no_intent : social/greeting query; expect_idx MUST be [] (gate: 0% injection)
#   unrelated : topic not present in memories; expect_idx MUST be []
# Write-path kinds (runner lands in phase 3; harness marks them deferred):
#   update    : memories + new (+ new_type) + expect: supersede | create
#   duplicate : memories + new + expect: noop
# Privacy kind (runner lands in phase 1; harness marks it deferred):
#   secret    : text + expect: redact | keep
#
# Optional field:
#   tags: [semantic-gap]  -> case needs semantic understanding beyond safe
#                            lexical matching (zero/near-zero topic overlap,
#                            cross-language synonyms, deep morphology).
#                            Retrieval cases: never excluded from recall gates.
#                            Update cases: always counted in update_accuracy
#                            (overall, permanently visible); the lexical-tier
#                            gate (update_accuracy_lexical) covers only untagged
#                            cases, and the tagged subset is the explicit scope
#                            of the semantic-reconciliation tier (plan 3.3).
#
# Coverage notes
# --------------
# Arabic positives cover: attached clitics (prefix/suffix), taa-marbuta/ha
# variants, hamza variants, diacritics and tatweel, stopword-heavy questions,
# Latin tokens inside Arabic text, and precision distractors (Berlin vs
# Frankfurt, my-name vs cat-name). Russian covers yo/e folding and case.
# English covers prefix wildcards (deploy/deployment), possessives, hyphens,
# case folding and stopword-heavy questions.
#
# Review policy: every new case needs a second reviewer; real user cases are
# added only anonymized and with consent (plan phase 6 feedback loop).
# Do NOT reorder or renumber ids: baseline reports reference them.

